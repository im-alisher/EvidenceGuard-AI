[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "evidenceguard-ai"
version = "0.1.0"
description = "Uncertainty-aware evidence evaluation and abstention benchmark for retrieval-augmented generation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "EvidenceGuard AI contributors" }]
keywords = [
    "abstention",
    "benchmark",
    "evidence",
    "rag",
    "retrieval",
    "scifact",
    "uncertainty",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26,<3",
    "PyYAML>=6.0,<7",
    "rank-bm25>=0.2.2,<0.3",
]

[project.optional-dependencies]
dense = ["sentence-transformers>=3.0,<7"]
analysis = [
    "matplotlib>=3.8,<4",
    "pandas>=2.2,<4",
    "scikit-learn>=1.5,<2",
]
dashboard = ["streamlit>=1.40,<2"]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evidenceguard = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error"]
markers = [
    "integration: requires local datasets or optional model artifacts",
    "slow: takes materially longer than the offline smoke-test path",
]

[tool.coverage.run]
branch = true
source = ["evidenceguard"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
